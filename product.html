<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nos Produits | Zayena Olive</title>

  <!-- Tailwind CDN (no build required, GitHub-friendly) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
  />

  <!-- Brand Theme Variables -->
  <style>
    :root {
      --background: #fafaf5;
      --foreground: #1f2933;
      --primary: #3f6f3c;
      --secondary: #e6edd9;
      --accent: #d97706;
      --border: #e5e7eb;
      --radius: 0.625rem;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
    }
  </style>

  <!-- Tailwind Config Override -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)",
            foreground: "var(--foreground)",
            primary: "var(--primary)",
            secondary: "var(--secondary)",
            accent: "var(--accent)",
            border: "var(--border)",
          },
          borderRadius: {
            xl: "var(--radius)",
          },
        },
      },
    };
  </script>
</head>

<body class="bg-background text-foreground">

<!-- ================= HEADER ================= -->
<header class="border-b sticky top-0 bg-white/90 backdrop-blur z-50">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

    <!-- LOGO -->
    <a href="index.html" class="flex items-center">
      <img
        src="PASTE_DIRECT_IMAGE_URL_HERE"
        alt="Zayena Olive Logo"
        class="h-10 w-auto object-contain"
      />
    </a>

    <!-- NAVIGATION -->
    <nav class="hidden md:flex gap-8 text-sm font-medium">
      <a href="index.html" class="hover:text-primary">Accueil</a>
      <a href="about.html" class="hover:text-primary">À Propos</a>
      <a href="product.html" class="text-primary font-bold border-b-2 border-primary">Produits</a>
      <a href="contact.html" class="hover:text-primary">Contact</a>
    </nav>

    <!-- CART -->
    <a href="checkout.html" class="relative p-2 text-slate-600 hover:text-primary">
      <i class="fas fa-shopping-basket text-xl"></i>
      <span class="absolute top-0 right-0 bg-primary text-white text-[10px] px-1.5 rounded-full">0</span>
    </a>

  </div>
</header>

<!-- ================= HERO ================= -->
<section class="bg-secondary py-12">
  <div class="max-w-7xl mx-auto px-6">
    <h1 class="text-4xl font-bold text-primary mb-2">Nos Produits</h1>
    <p class="text-lg text-primary/80">
      Explorez notre collection complète de tartinades d'olive marocaines authentiques.
    </p>
  </div>
</section>

<!-- ================= MAIN ================= -->
<main class="max-w-7xl mx-auto px-6 py-12 grid lg:grid-cols-4 gap-12">

<!-- FILTERS -->
<aside class="space-y-8">
  <h3 class="font-bold text-lg flex items-center gap-2">
    <i class="fas fa-filter text-primary"></i> Filtres
  </h3>
  <div class="space-y-2">
    <button class="w-full px-4 py-2 bg-primary text-white rounded-xl">Tous</button>
    <button class="w-full px-4 py-2 hover:bg-secondary rounded-xl">Agrumes</button>
    <button class="w-full px-4 py-2 hover:bg-secondary rounded-xl">Herbes</button>
    <button class="w-full px-4 py-2 hover:bg-secondary rounded-xl">Épicé</button>
    <button class="w-full px-4 py-2 hover:bg-secondary rounded-xl">Premium</button>
  </div>
</aside>

<!-- PRODUCTS -->
<section class="lg:col-span-3 grid md:grid-cols-2 lg:grid-cols-3 gap-8">

<!-- PRODUCT CARD -->
<div class="bg-white border rounded-xl overflow-hidden hover:shadow-xl transition flex flex-col">
  <img
    src="https://images.unsplash.com/photo-1541012436513-d658fc93c11f?q=80&w=800"
    alt="Olive Citron"
    class="aspect-square object-cover"
  />
  <div class="p-6 flex flex-col flex-1">
    <span class="text-xs font-bold text-primary uppercase">Agrumes</span>
    <h3 class="font-bold text-lg mt-1">Olive-Citron</h3>
    <p class="text-sm text-slate-500 flex-1 mt-2">
      Mélange frais de citron et olive avec une saveur vive.
    </p>
    <div class="flex justify-between items-center mt-4">
      <span class="text-xl font-bold text-primary">28 dh</span>
      <button class="bg-primary text-white p-2 rounded-lg">
        <i class="fas fa-cart-plus"></i>
      </button>
    </div>
  </div>
</div>

<!-- DUPLICATE PRODUCT CARDS AS NEEDED -->

</section>
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-slate-50 border-t py-12 text-center">
  <p class="text-slate-500 text-sm">
    &copy; 2026 Zayena Olive. Fait avec passion à Marrakech.
  </p>
</footer>

</body>
</html>
