<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique | Zayen Olive HD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* FORCE LA QUALITÉ HD SANS FLOU */
    img { 
      image-rendering: -webkit-optimize-contrast !important; 
      image-rendering: high-quality !important;
      object-fit: cover !important;
      width: 100%;
      height: 100%;
    }
    .product-card img { transition: transform 0.5s ease; }
    .product-card:hover img { transform: scale(1.08); }
  </style>
</head>
<body class="bg-white font-sans">

  <header class="py-12 text-center bg-[#fdfbf7]">
    <h1 class="text-3xl font-bold text-[#4a5d23] uppercase tracking-widest">Notre Boutique</h1>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-16">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10">
      
      <div class="product-card">
        <div class="relative aspect-square overflow-hidden rounded-3xl shadow-sm bg-gray-50 mb-4">
          <img src="https://i.ibb.co/JWFRG3Lw/gamme1.jpg" alt="Citron">
        </div>
        <h3 class="font-bold text-gray-900">OLIVE-CITRON</h3>
        <p class="text-[#4a5d23] font-bold text-lg">28 MAD</p>
      </div>

      <div class="product-card">
        <div class="relative aspect-square overflow-hidden rounded-3xl shadow-sm bg-gray-50 mb-4">
          <img src="https://i.ibb.co/rKgPb2mD/gamme2.jpg" alt="Thym">
        </div>
        <h3 class="font-bold text-gray-900">THYM</h3>
        <p class="text-[#4a5d23] font-bold text-lg">28 MAD</p>
      </div>

      <div class="product-card">
        <div class="relative aspect-square overflow-hidden rounded-3xl shadow-md border-2 border-[#c5a059]/20 mb-4">
          <img src="https://i.ibb.co/SWVNs61/gamme3.jpg" alt="Harissa">
        </div>
        <h3 class="font-bold text-[#c5a059]">HARISSA</h3>
        <p class="text-[#c5a059] font-bold text-lg">30 MAD</p>
      </div>

      <div class="product-card">
        <div class="relative aspect-square overflow-hidden rounded-3xl shadow-sm bg-gray-50 mb-4">
          <img src="https://i.ibb.co/s9c3W70W/gamme4.jpg" alt="Persil">
        </div>
        <h3 class="font-bold text-gray-900">PERSIL</h3>
        <p class="text-[#4a5d23] font-bold text-lg">28 MAD</p>
      </div>

    </div>
  </main>

</body>
</html>
