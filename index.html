<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique HD | Zayen Olive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: "#4a5d23", gold: "#c5a059", beige: "#fdfbf7" }
        }
      }
    }
  </script>
  <style>
    /* FORCE LA QUALITÉ ULTRA HD ET SUPPRIME LE FLOU */
    img { 
      image-rendering: -webkit-optimize-contrast !important; 
      image-rendering: crisp-edges !important;
      image-rendering: high-quality !important;
      object-fit: cover !important;
    }
    .cart-drawer { transform: translateX(100%); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .cart-open .cart-drawer { transform: translateX(0); }
    .cart-open { overflow: hidden; }
  </style>
</head>
<body class="bg-white">

  <div id="cartDrawer" class="cart-drawer fixed right-0 top-0 h-full w-full md:w-[400px] bg-white z-[100] shadow-2xl p-10 flex flex-col border-l">
    <div class="flex justify-between items-center mb-10 border-b pb-6">
      <h2 class="font-bold uppercase tracking-widest text-sm text-primary">Panier</h2>
      <button onclick="toggleCart()" class="text-4xl text-gray-300">&times;</button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto"></div>
    <div class="border-t pt-8 mt-6">
      <div class="flex justify-between font-bold text-2xl mb-8"><span>Total</span><span id="cartTotal">0 MAD</span></div>
      <button onclick="checkoutWhatsApp()" class="w-full bg-primary text-white py-5 rounded-full font-bold uppercase tracking-widest shadow-xl">Commander WhatsApp</button>
    </div>
  </div>

  <nav class="flex items-center justify-between px-8 py-6 sticky top-0 bg-white/95 backdrop-blur-md z-50 border-b border-gray-100">
    <a href="index.html"><img src="https://i.ibb.co/LXnb2nGD/logo.png" class="h-12"></a>
    <div class="flex items-center gap-6">
      <a href="https://www.instagram.com/zayena.olive/" target="_blank" class="text-primary hover:text-gold transition text-2xl"><i class="fab fa-instagram"></i></a>
      <button onclick="toggleCart()" class="relative bg-primary text-white p-3 rounded-full">
        <i class="fas fa-shopping-basket"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-gold text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </nav>

  <header class="py-16 text-center bg-beige">
    <h1 class="text-4xl font-light italic text-primary mb-4">Collection Exclusive</h1>
    <p class="text-gray-500 text-sm tracking-wide">Qualité HD Garantie</p>
  </header>

  <main class="max-w-7xl mx-auto px-8 py-20">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12">
      
      <div class="group">
        <div class="relative aspect-[4/5] overflow-hidden rounded-2xl bg-gray-100 mb-6 shadow-sm">
          <img src="https://i.ibb.co/JWFRG3Lw/gamme1.jpg" class="w-full h-full group-hover:scale-105 transition duration-500">
        </div>
        <h3 class="font-bold text-gray-900 uppercase">Olive-Citron</h3>
        <p class="mt-4 text-primary font-bold">28 MAD</p>
        <button onclick="addToCart('Olive-Citron', 28, 'https://i.ibb.co/JWFRG3Lw/gamme1.jpg')" class="w-full mt-4 bg-primary text-white py-3 rounded-xl text-[10px] font-bold uppercase">Ajouter</button>
      </div>

      <div class="group">
        <div class="relative aspect-[4/5] overflow-hidden rounded-2xl bg-gray-100 mb-6 shadow-sm">
          <img src="https://i.ibb.co/SWVNs61/gamme3.jpg" class="w-full h-full group-hover:scale-105 transition duration-500">
        </div>
        <h3 class="font-bold text-gray-900 uppercase">Thym</h3>
        <p class="mt-4 text-primary font-bold">28 MAD</p>
        <button onclick="addToCart('Thym', 28, 'https://i.ibb.co/SWVNs61/gamme3.jpg')" class="w-full mt-4 bg-primary text-white py-3 rounded-xl text-[10px] font-bold uppercase">Ajouter</button>
      </div>

      <div class="group">
        <div class="relative aspect-[4/5] overflow-hidden rounded-2xl bg-gray-100 mb-6 shadow-md border-2 border-gold/20">
          <img src="https://i.ibb.co/rKgPb2mD/gamme2.jpg" class="w-full h-full group-hover:scale-105 transition duration-500">
        </div>
        <h3 class="font-bold text-gold uppercase">Harissa</h3>
        <p class="mt-4 text-gold font-bold">30 MAD</p>
        <button onclick="addToCart('Harissa', 30, 'https://i.ibb.co/rKgPb2mD/gamme2.jpg')" class="w-full mt-4 bg-gold text-white py-3 rounded-xl text-[10px] font-bold uppercase">Ajouter</button>
      </div>

      <div class="group">
        <div class="relative aspect-[4/5] overflow-hidden rounded-2xl bg-gray-100 mb-6 shadow-sm">
          <img src="https://i.ibb.co/s9c3W70W/gamme4.jpg" class="w-full h-full group-hover:scale-105 transition duration-500">
        </div>
        <h3 class="font-bold text-gray-900 uppercase">Persil</h3>
        <p class="mt-4 text-primary font-bold">28 MAD</p>
        <button onclick="addToCart('Persil', 28, 'https://i.ibb.co/s9c3W70W/gamme4.jpg')" class="w-full mt-4 bg-primary text-white py-3 rounded-xl text-[10px] font-bold uppercase">Ajouter</button>
      </div>

    </div>
  </main>

  <script>
    let cart = [];
    function toggleCart() { document.body.classList.toggle('cart-open'); }
    function addToCart(name, price, img) {
      cart.push({name, price, img});
      updateCart();
      if(!document.body.classList.contains('cart-open')) toggleCart();
    }
    function updateCart() {
      const itemsDiv = document.getElementById('cartItems');
      const countSpan = document.getElementById('cart-count');
      const totalSpan = document.getElementById('cartTotal');
      countSpan.innerText = cart.length;
      if(cart.length === 0) {
        itemsDiv.innerHTML = '<p class="text-gray-400 text-center italic mt-10">Panier Vide</p>';
        totalSpan.innerText = '0 MAD'; return;
      }
      let total = 0;
      itemsDiv.innerHTML = cart.map((item, index) => {
        total += item.price;
        return `<div class="flex items-center gap-4 p-4 border-b border-gray-50">
                  <img src="${item.img}" class="w-16 h-16 rounded-lg">
                  <div class="flex-1 text-xs font-bold uppercase">${item.name}<br>${item.price} MAD</div>
                  <button onclick="removeFromCart(${index})" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                </div>`;
      }).join('');
      totalSpan.innerText = total + ' MAD';
    }
    function removeFromCart(index) { cart.splice(index, 1); updateCart(); }
    function checkoutWhatsApp() {
      let msg = "Bonjour Zayen Olive, je commande :\n\n";
      cart.forEach(i => msg += `- ${i.name} : ${i.price} MAD\n`);
      msg += `\nTotal : ${document.getElementById('cartTotal').innerText}`;
      window.open(`https://wa.me/212690238881?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
</body>
</html>
