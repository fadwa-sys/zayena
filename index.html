<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zayena Olive | Maison de Confiserie Fine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #b38e44;
            --black: #1a1a1a;
            --sand: #f8f5f0;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--sand);
            color: var(--black);
            line-height: 1.6;
        }

        /* --- NAVIGATION --- */
        nav {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-decoration: none;
            color: var(--white);
            font-weight: 700;
        }

        .cart-icon {
            color: var(--white);
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        /* --- HERO --- */
        header {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.ibb.co/7NyGJ8Mm/image2.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--white);
            text-align: center;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            margin-bottom: 1rem;
            letter-spacing: 8px;
        }

        header p {
            font-weight: 200;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 0.9rem;
        }

        /* --- SECTION PRODUITS --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 5%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 6rem;
        }

        .section-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .section-header .line {
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 4rem;
        }

        .product-card {
            background: none;
            text-align: center;
            transition: 0.4s;
        }

        .img-container {
            width: 100%;
            height: 450px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid #e0dbd1;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s;
            filter: grayscale(20%);
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        .product-card h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .price {
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: block;
        }

        .btn-add {
            background: none;
            border: 1px solid var(--black);
            padding: 0.8rem 2rem;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:hover {
            background: var(--black);
            color: var(--white);
        }

        /* --- FOOTER --- */
        footer {
            padding: 5rem 5%;
            background: #111;
            color: var(--white);
            text-align: center;
        }

        .footer-logo {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            margin-bottom: 2rem;
            display: block;
        }

        .social {
            margin-bottom: 3rem;
        }

        .social a {
            color: var(--white);
            margin: 0 15px;
            font-size: 1.5rem;
            text-decoration: none;
            opacity: 0.7;
            transition: 0.3s;
        }

        .social a:hover { opacity: 1; color: var(--gold); }

        .copyright {
            font-size: 0.6rem;
            letter-spacing: 3px;
            opacity: 0.4;
            text-transform: uppercase;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .img-container { height: 350px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">ZAYENA</a>
        <div class="cart-icon" onclick="openWhatsApp()">
            <i class="fas fa-shopping-bag"></i>
        </div>
    </nav>

    <header>
        <p>Maison de Tradition</p>
        <h1>ZAYENA OLIVE</h1>
        <p>L'Essence du Terroir Marocain</p>
    </header>

    <section class="container" id="collection">
        <div class="section-header">
            <h2>La Collection</h2>
            <div class="line"></div>
        </div>

        <div class="product-grid">
            <div class="product-card">
                <div class="img-container">
                    <img src="https://i.ibb.co/JWFRG3Lw/gamme1.jpg" class="product-img">
                </div>
                <h3>Olive & Citron</h3>
                <span class="price">28 MAD</span>
                <button class="btn-add" onclick="directOrder('Olive & Citron')">Commander</button>
            </div>

            <div class="product-card">
                <div class="img-container">
                    <img src="https://i.ibb.co/rKgPb2mD/gamme2.jpg" class="product-img">
                </div>
                <h3>Olive & Thym</h3>
                <span class="price">28 MAD</span>
                <button class="btn-add" onclick="directOrder('Olive & Thym')">Commander</button>
            </div>

            <div class="product-card">
                <div class="img-container">
                    <img src="https://i.ibb.co/SWVNs61/gamme3.jpg" class="product-img">
                </div>
                <h3>Harissa Royale</h3>
                <span class="price">30 MAD</span>
                <button class="btn-add" onclick="directOrder('Harissa Royale')">Commander</button>
            </div>

            <div class="product-card">
                <div class="img-container">
                    <img src="https://i.ibb.co/s9c3W70W/gamme4.jpg" class="product-img">
                </div>
                <h3>Olive & Persil</h3>
                <span class="price">28 MAD</span>
                <button class="btn-add" onclick="directOrder('Olive & Persil')">Commander</button>
            </div>
        </div>
    </section>

    <footer>
        <span class="footer-logo">ZAYENA OLIVE</span>
        <div class="social">
            <a href="https://www.instagram.com/zayena.olive/"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/212690238881"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright">&copy; 2026 Zayena Olive — Marrakech. Tous droits réservés.</p>
    </footer>

    <script>
        function directOrder(product) {
            const msg = encodeURIComponent(`Bonjour Zayena Olive, je souhaite commander le produit : ${product}`);
            window.open(`https://wa.me/212690238881?text=${msg}`);
        }
        function openWhatsApp() {
            window.open(`https://wa.me/212690238881`);
        }
    </script>

</body>
</html>
