<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zayena Olive | Tartinades Artisanales Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #c5a059;
            --olive-dark: #1a1a1a;
            --cream: #f4f1ea; 
            --dark-text: #1a1a1a;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--dark-text);
            background-color: var(--cream);
            overflow-x: hidden;
        }

        /* --- SYSTÈME DE PANIER (DRAWER) --- */
        #cart-drawer {
            position: fixed; right: -100%; top: 0; width: 350px; height: 100%;
            background: white; z-index: 2000; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1); padding: 2rem;
            display: flex; flex-direction: column;
        }
        #cart-drawer.active { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        #cart-items { flex-grow: 1; overflow-y: auto; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #fafafa; }
        .cart-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .cart-total-footer { border-top: 1px solid #eee; padding-top: 1rem; }
        .btn-checkout { background: #25d366; color: white; border: none; width: 100%; padding: 1rem; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(244, 241, 234, 0.95);
            padding: 1.5rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; z-index: 1000; backdrop-blur: 10px;
        }

        .logo { color: var(--dark-text); font-family: 'Playfair Display', serif; font-size: 2rem; text-decoration: none; font-weight: bold; font-style: italic; }

        .nav-links { display: flex; list-style: none; }
        .nav-links li a { color: var(--dark-text); text-decoration: none; margin-left: 2rem; transition: 0.3s; font-weight: 500; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; }
        .nav-links li a:hover { color: var(--primary-gold); }

        /* --- HERO SECTION --- */
        header {
            height: 90vh; margin: 10px; border-radius: 30px;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.ibb.co/7NyGJ8Mm/image2.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: var(--white); overflow: hidden;
        }

        header h1 { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 8vw, 7rem); font-style: italic; margin-bottom: 1rem; }
        header p { font-size: 1.2rem; max-width: 800px; margin-bottom: 2rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }

        .btn-primary { background: var(--white); color: var(--olive-dark); padding: 1.2rem 3rem; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; transition: 0.4s; }
        .btn-primary:hover { background: var(--primary-gold); color: white; transform: translateY(-5px); }

        /* --- STATS --- */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); padding: 6rem 10%; text-align: center; gap: 2rem; }
        .stat-item h3 { font-family: 'Playfair Display', serif; font-size: 4rem; color: var(--primary-gold); font-style: italic; }
        .stat-item p { text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; font-weight: 600; opacity: 0.6; }

        /* --- PRODUITS --- */
        .products { padding: 5rem 5%; }
        .section-title { text-align: center; font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 5vw, 5rem); margin-bottom: 4rem; font-style: italic; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; max-width: 1400px; margin: 0 auto; }
        .product-card { background: var(--white); border-radius: 40px; overflow: hidden; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .product-card:hover { transform: translateY(-15px); }
