<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zayena Olive | Accueil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { primary: "#1a2e1a", accent: "#5b6b1a", beige: "#fafaf5" }
        }
      }
    }
  </script>
</head>
<body class="bg-white font-sans">

  <nav class="flex items-center justify-between px-8 py-6 sticky top-0 bg-white/90 backdrop-blur-md z-50">
    <a href="index.html">
      <img src="https://i.ibb.co/LXnb2nGD/logo.png" alt="Zayena Logo" class="h-10">
    </a>
    <div class="hidden md:flex gap-10 text-[12px] font-bold uppercase tracking-widest text-gray-500">
      <a href="index.html" class="text-black border-b border-black">Accueil</a>
      <a href="product.html" class="hover:text-black transition">Boutique</a>
      <a href="testimonials.html" class="hover:text-black transition">Avis</a>
    </div>
    <div class="flex items-center gap-5">
      <i class="fas fa-shopping-cart text-gray-800"></i>
    </div>
  </nav>

  <section class="relative h-[80vh] flex items-center justify-center bg-beige overflow-hidden">
    <div class="z-10 text-center px-6">
      <h1 class="text-5xl md:text-7xl font-light tracking-tight text-primary mb-6">L'art de l'olive <br><span class="italic">marocaine</span></h1>
      <p class="text-gray-600 max-w-lg mx-auto mb-10 text-lg">Une expérience gastronomique premium du terroir de Marrakech.</p>
      <a href="product.html" class="inline-block bg-primary text-white px-10 py-4 rounded-full text-sm font-bold tracking-widest uppercase hover:bg-black transition shadow-xl">
        Découvrir nos produits
      </a>
    </div>
    <img src="https://i.ibb.co/7NyGJ8Mm/image2.jpg" class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none">
  </section>

  <section class="max-w-7xl mx-auto px-8 py-24">
    <h2 class="text-3xl font-light mb-16 text-center italic">Nos Saveurs Signature</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
      <a href="product.html" class="group">
        <div class="aspect-[4/5] overflow-hidden bg-gray-100 mb-6 rounded-2xl shadow-sm">
          <img src="https://i.ibb.co/JWFRG3Lw/gamme1.jpg" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
        </div>
        <h3 class="text-sm font-bold tracking-widest uppercase">Première Gamme</h3>
        <p class="text-gray-400 text-xs mt-1">Équilibre & Pureté</p>
      </a>

      <a href="product.html" class="group">
        <div class="aspect-[4/5] overflow-hidden bg-gray-100 mb-6 rounded-2xl shadow-sm">
          <img src="https://i.ibb.co/rKgPb2mD/gamme2.jpg" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
        </div>
        <h3 class="text-sm font-bold tracking-widest uppercase">Deuxième Gamme</h3>
        <p class="text-gray-400 text-xs mt-1">Intense & Caractère</p>
      </a>

      <a href="product.html" class="group">
        <div class="aspect-[4/5] overflow-hidden bg-gray-100 mb-6 rounded-2xl shadow-sm">
          <img src="https://i.ibb.co/SWVNs61/gamme3.jpg" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
        </div>
        <h3 class="text-sm font-bold tracking-widest uppercase">Troisième Gamme</h3>
        <p class="text-gray-400 text-xs mt-1">Douceur Fruitée</p>
      </a>
    </div>
  </section>

  <footer class="py-12 border-t border-gray-100 text-center">
    <p class="text-[10px] tracking-[0.3em] uppercase text-gray-400 font-bold">Zayena Olive Marrakech &copy; 2026</p>
  </footer>

</body>
</html>
