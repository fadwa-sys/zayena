<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zayen Olive | Maison Artisanale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 
            serif: ['Playfair Display', 'serif'], 
            sans: ['Plus Jakarta Sans', 'sans-serif'] 
          },
          colors: { 
            primary: "#1a1a1a", 
            gold: "#c5a059", 
            olive: "#3d4a1e",
            /* LA COULEUR DE FOND QUE TU AS DEMANDÉE */
            brandBg: "#f4f1ea" 
          }
        }
      }
    }
  </script>
  <style>
    /* ⚡ RENDU ULTRA HD POUR LES PHOTOS */
    img { 
      image-rendering: -webkit-optimize-contrast !important; 
      image-rendering: high-quality !important;
      object-fit: cover !important;
    }
    html { scroll-behavior: smooth; }
    .cart-drawer { transform: translateX(100%); transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
    .cart-open .cart-drawer { transform: translateX(0); }
    .cart-open { overflow: hidden; }
    
    /* Animation pour le texte luxe */
    .fade-up { animation: fadeUp 1s ease-out; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-brandBg font-sans text-primary">

  <div id="cartDrawer" class="cart-drawer fixed right-0 top-0 h-full w-full md:w-[550px] bg-white z-[100] shadow-2xl p-8 md:p-16 flex flex-col border-l">
    <div class="flex justify-between items-center mb-16">
      <h2 class="font-serif text-4xl italic">Mon Panier</h2>
      <button onclick="toggleCart()" class="text-5xl font-light hover:rotate-90 transition-transform duration-300">&times;</button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto space-y-10"></div>
    <div class="border-t border-gray-100 pt-10 mt-6">
      <div class="flex justify-between font-serif text-4xl mb-12">
        <span>Total</span>
        <span id="cartTotal">0 MAD</span>
      </div>
      <button onclick="checkoutWhatsApp()" class="w-full bg-primary text-white py-7 rounded-full font-bold uppercase tracking-[0.3em] text-xs hover:bg-gold transition-all shadow-2xl">
        Passer la commande sur WhatsApp
      </button>
    </div>
  </div>

  <nav class="flex items-center justify-between px-6 md:px-16 py-10 sticky top-0 bg-brandBg/80 backdrop-blur-lg z-50">
    <div class="flex items-center gap-6">
      <img src="https://i.ibb.co/LXnb2nGD/logo.png" class="h-14 md:h-20" alt="Logo Zayen">
      <span class="font-serif text-3xl md:text-5xl tracking-tighter italic">Zayen</span>
    </div>
    <div class="flex items-center gap-12">
      <a href="https://www.instagram.com/zayena.olive/" target="_blank" class="text-3xl hover:text-gold transition-all"><i class="fab fa-instagram"></i></a>
      <button onclick="toggleCart()" class="relative group">
        <i class="fas fa-shopping-bag text-3xl group-hover:scale-110 transition-transform"></i>
        <span id="cartCount" class="absolute -top-3 -right-3 bg-gold text-white text-[11px] px-2.5 py-1 rounded-full font-bold shadow-lg">0</span>
      </button>
    </div>
  </nav>

  <header class="relative h-[90vh] flex items-center justify-center text-center px-6 overflow-hidden mx-4 md:mx-8 rounded-[3rem] mt-4">
    <img src="https://i.ibb.co/7NyGJ8Mm/image2.jpg" class="absolute inset-0 w-full h-full object-cover brightness-[0.8]" alt="Maison Zayen">
    <div class="relative z-10 text-white fade-up">
      <h1 class="font-serif text-7xl md:text-[12rem] mb-10 italic leading-none">L'Authentique</h1>
      <p class="text-xl md:text-3xl font-light mb-16 tracking-[0.2em] max-w-4xl mx-auto italic">Épicerie fine artisanale de Marrakech</p>
      <a href="#collection" class="inline-block bg-white text-black px-20 py-7 rounded-full text-xs font-bold uppercase tracking-[0.4em] hover:bg-gold hover:text-white transition-all shadow-2xl">
        Voir la Collection
      </a>
    </div>
  </header>

  <section id="collection" class="py-40 px-6 max-w-[1800px] mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-baseline mb-32 border-b border-black/5 pb-12">
      <h2 class="font-serif text-7xl md:text-[10rem] italic leading-none">Nos Gammes</h2>
      <p class="text-gold font-bold uppercase tracking-[0.4em] text-sm mt-8">Saison 2026</p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-16 md:gap-24">
      
      <div class="group">
        <div class="overflow-hidden rounded-[3rem] mb-10 shadow-2xl transition-transform duration-700 group-hover:-translate-y-4">
          <img src="https://i.ibb.co/JWFRG3Lw/gamme1.jpg" class="w-full aspect-[4/5] group-hover:scale-110 transition duration-[2s]">
        </div>
        <h3 class="font-serif text-4xl mb-4 italic">Olive & Citron</h3>
        <p class="text-2xl font-light mb-8 opacity-70">28 MAD</p>
        <button onclick="addToCart('Olive-Citron', 28, 'https://i.ibb.co/JWFRG3Lw/gamme1.jpg')" class="w-full py-6 rounded-full border border-black font-bold uppercase text-[10px] tracking-widest hover:bg-black hover:text-white transition-all">Ajouter au panier</button>
      </div>

      <div class="group">
        <div class="overflow-hidden rounded-[3rem] mb-10 shadow-2xl transition-transform duration-700 group-hover:-translate-y-4">
          <img src="https://i.ibb.co/rKgPb2mD/gamme2.jpg" class="w-full aspect-[4/5] group-hover:scale-110 transition duration-[2s]">
        </div>
        <h3 class="font-serif text-4xl mb-4 italic">Thym Sauvage</h3>
        <p class="text-2xl font-light mb-8 opacity-70">28 MAD</p>
        <button onclick="addToCart('Thym', 28, 'https://i.ibb.co/rKgPb2mD/gamme2.jpg')" class="w-full py-6 rounded-full border border-black font-bold uppercase text-[10px] tracking-widest hover:bg-black hover:text-white transition-all">Ajouter au panier</button>
      </div>

      <div class="group">
        <div class="overflow-hidden rounded-[3rem] mb-10 shadow-2xl transition-transform duration
