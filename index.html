<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Zayena Olive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #2e7d32;
      color: white;
      text-align: center;
      padding: 25px;
    }

    nav {
      background: #1b5e20;
      text-align: center;
      padding: 10px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .product {
      background: white;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    button {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #1b5e20;
    }

    .cart {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 8px;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 25px;
    }

    footer a {
      color: #4caf50;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Zayena Olive</h1>
  <p>Le Goût de l'Authenticité Marocaine</p>
</header>

<nav>
  <a href="#produits">Produits</a>
  <a href="#contact">Contact</a>
</nav>

<!-- IMAGE PRINCIPALE (famille) -->
<section class="hero">
  <img src="https://images.unsplash.com/photo-1606787366850-de6330128bfc" alt="Famille Zayena">
</section>

<!-- PRODUITS -->
<section id="produits" class="products">

  <div class="product">
    <img src="https://ibb.co/QFLc90gP">
    <h3>Olive Citron</h3>
    <p>28 DH</p>
    <button onclick="addToCart('Olive Citron')">Ajouter au panier</button>
  </div>

  <div class="product">
    <img src="https://ibb.co/35gSSNk9">
    <h3>Thym</h3>
    <p>28 DH</p>
    <button onclick="addToCart('Thym')">Ajouter au panier</button>
  </div>

  <div class="product">
    <img src="https://ibb.co/QxWmwpj">
    <h3>Harissa</h3>
    <p>30 DH</p>
    <button onclick="addToCart('Harissa')">Ajouter au panier</button>
  </div>

  <div class="product">
    <img src="https://ibb.co/Qj6GGGTt">
    <h3>Persil</h3>
    <p>28 DH</p>
    <button onclick="addToCart('Persil')">Ajouter au panier</button>
  </div>

  <div class="product">
    <img src="https://ibb.co/tMHwqwT7">
    <h3>Olive Nature</h3>
    <p>28 DH</p>
    <button onclick="addToCart('Olive Nature')">Ajouter au panier</button>
  </div>

  <div class="product">
    <img src="https://ibb.co/xK3Wfnrz">
    <h3>Recette Maison</h3>
    <p>28 DH</p>
    <button onclick="addToCart('Recette Maison')">Ajouter au panier</button>
  </div>

  <div class="product">
    <img src="https://ibb.co/LhcFnXFY">
    <h3>Spécial Zayena</h3>
    <p>30 DH</p>
    <button onclick="addToCart('Spécial Zayena')">Ajouter au panier</button>
  </div>

</section>

<!-- PANIER -->
<section class="cart">
  <h2>Panier</h2>
  <ul id="cartList"></ul>
</section>

<!-- CONTACT -->
<footer id="contact">
  <p><strong>Numéro :</strong> 0690238881</p>

  <p>
    Instagram :
    <a href="https://www.instagram.com/zayena.olive/" target="_blank">
      @zayena.olive
    </a>
  </p>

  <p>
    TikTok :
    <a href="https://www.tiktok.com/@zayena.olive?_r=1&_t=ZS-940bWqHcptM" target="_blank">
      @zayena.olive
    </a>
  </p>
</footer>

<script>
  function addToCart(product) {
    const list = document.getElementById("cartList");
    const li = document.createElement("li");
    li.textContent = product;
    list.appendChild(li);
  }
</script>

</body>
</html>
