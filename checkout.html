<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paiement | Zayena Olive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50">
    <header class="bg-white border-b p-6 mb-12">
        <div class="max-w-6xl mx-auto flex justify-between">
            <a href="index.html" class="font-bold text-emerald-900">ZAYENA OLIVE</a>
            <nav class="flex gap-4 text-sm">
                <a href="index.html">Retour au site</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-8 rounded-2xl border shadow-sm">
                <h2 class="text-2xl font-bold mb-6">Livraison</h2>
                <form class="grid grid-cols-2 gap-4">
                    <input type="text" placeholder="Prénom" class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                    <input type="text" placeholder="Nom" class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                    <input type="email" placeholder="Email" class="p-3 border rounded-lg col-span-2">
                    <input type="text" placeholder="Adresse" class="p-3 border rounded-lg col-span-2">
                    <button type="button" class="col-span-2 bg-emerald-800 text-white py-4 rounded-xl font-bold">Continuer</button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-2xl border shadow-sm sticky top-6">
                <h3 class="font-bold mb-4 border-b pb-2">Résumé</h3>
                <div class="space-y-3 mb-6">
                    <div class="flex justify-between text-sm"><span>Olive Citron x2</span><span>56 dh</span></div>
                    <div class="flex justify-between text-sm"><span>Harissa x1</span><span>30 dh</span></div>
                </div>
                <div class="border-t pt-4 space-y-2 font-bold">
                    <div class="flex justify-between text-emerald-900 text-xl">
                        <span>Total</span>
                        <span>106 dh</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
